name: Datos OSM de la Ruta 1

# Descarga de OpenStreetMap el entorno de las paradas de la Ruta 1 y guarda
# zonas-datos-r1.js y zonas-fichas-r1.js (para el visor 3D de la app).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [herramientas/osm_ruta1.mjs]

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Descargar y convertir
        run: node herramientas/osm_ruta1.mjs
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zonas-datos-r1.js zonas-fichas-r1.js
          git commit -m "Datos de OpenStreetMap de las paradas de la Ruta 1" || exit 0
          git pull --rebase origin main
          git push
